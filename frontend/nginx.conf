# Serves the built SPA inside the frontend image. TLS, the domain and /api/
# stay with the VPS's nginx (infra/nginx.example.conf), which proxies / here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles (dist/assets/*-<hash>.js): the name changes whenever the
    # content does, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route (/history, /plan/day?date=...),
    # so an unknown path gets index.html and the router decides — including
    # its own 404 screen. index.html is never cached: after a deploy or a
    # rollback the browser must pick up the new asset names at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
