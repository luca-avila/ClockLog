# Dev-only. Auto-cargado por 'docker compose up' cuando no se pasa -f.
# Nunca incluirlo en prod: el deploy pasa `-f docker-compose.yml` explícito
# (docker-compose.prod.yml solo se agrega para el comando legacy de dos -f),
# que NO auto-cargan este archivo, así que prod queda limpio por construcción.
#
# La base interpola ${VAR:?...} desde .env / el shell (por eso hace falta un
# .env, p. ej. copiando .env.example). La base exige RESEND_API_KEY como
# cualquier otra requerida; dev/CI la satisfacen con un placeholder NO secreto
# en .env y este archivo fuerza el runtime dev a vacío, para que el sender
# siga logueando el link y el conftest (RESEND_API_KEY vacía obligatoria en
# tests) quede verde. Este archivo también pisa las credenciales dev de
# runtime (clocklog/clocklog). La interpolación aplica a los servicios
# excluidos por profile, así que dev necesita en .env la NEXT_PUBLIC_API_URL
# requerida por la base aunque el frontend no corra en Compose en dev.

services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      EMAIL_FROM: "ClockLog <no-reply@localhost>"
      RESEND_API_KEY: ""
      # Tests DELETE de cada tabla — corren contra clocklog_test, nunca la DB
      # dev. El sufijo _test lo exige tests/conftest.py.
      TEST_DATABASE_URL: postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog_test

  db:
    environment:
      POSTGRES_USER: clocklog
      POSTGRES_PASSWORD: clocklog
      POSTGRES_DB: clocklog

  # Servicios que existen en la base (prod) pero no deben arrancar en dev/CI:
  # el frontend dev corre en el host (`npm run dev`) y el backup nocturno no
  # pinta nada en un stack local. Arrancarlos requiere --profile prod-sidecars.
  frontend:
    profiles: ["prod-sidecars"]
  backup:
    profiles: ["prod-sidecars"]
