# Dev-only. Auto-loaded by 'docker compose up' when no -f is passed.
# Never include it in prod: the deploy passes `-f docker-compose.yml` explicitly,
# which does NOT auto-load this file, so prod stays clean by construction.
#
# The base interpolates ${VAR:?...} from .env / the shell (which is why an
# .env is needed, e.g. by copying .env.example). The base requires RESEND_API_KEY
# like any other required var; dev/CI satisfy it with a NON-secret placeholder
# in .env and this file forces the dev runtime to empty, so the sender keeps
# logging the link and conftest (empty RESEND_API_KEY mandatory in tests) stays
# green. This file also pins the dev runtime credentials (clocklog/clocklog).
# Interpolation applies to profile-excluded services, so dev needs the
# NEXT_PUBLIC_API_URL required by the base in .env even though the frontend does
# not run in Compose in dev.

services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      EMAIL_FROM: "ClockLog <no-reply@localhost>"
      RESEND_API_KEY: ""
      # Tests DELETE every table — they run against clocklog_test, never the
      # dev DB. The _test suffix is enforced by tests/conftest.py.
      TEST_DATABASE_URL: postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog_test

  db:
    environment:
      POSTGRES_USER: clocklog
      POSTGRES_PASSWORD: clocklog
      POSTGRES_DB: clocklog

  # Services present in the base (prod) that must not start in dev/CI:
  # the dev frontend runs on the host (`npm run dev`) and the nightly backup
  # has no business in a local stack. Starting them requires --profile prod-sidecars.
  frontend:
    profiles: ["prod-sidecars"]
  backup:
    profiles: ["prod-sidecars"]
