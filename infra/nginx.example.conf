# Example reverse-proxy config for the single-domain layout (see docs/operations.md).
# One origin serves both halves: / is the frontend, /api is the backend. This makes
# CORS irrelevant — the browser never goes cross-origin.
#
# Copy to /etc/nginx/sites-available/clocklog and symlink it into sites-enabled.
# Only the :80 block below is active, and it must stay that way until the cert
# exists: hard-coding ssl_certificate paths that are not on disk yet fails
# `nginx -t` with an emerg, which blocks certbot (it needs nginx up for the
# challenge). Order of operations on the VPS:
#
#   sudo cp infra/nginx.example.conf /etc/nginx/sites-available/clocklog
#   sudo ln -s /etc/nginx/sites-available/clocklog /etc/nginx/sites-enabled/clocklog
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d clocklog.net -d www.clocklog.net --redirect
#
# certbot injects a location for the ACME challenge above the 301 (so the
# redirect does not eat it), then rewrites the :80 block into a redirect to
# https and GENERATES the 443 server block shown commented below with the real
# cert paths. Do not edit that block by hand afterwards; certbot owns it.
#
# Ports match the prod-safe base compose file (docker-compose.yml):
#   frontend binds 127.0.0.1:3001  (moved off 3000 to leave that host port free)
#   backend  binds 127.0.0.1:8000
# With these, the .env values are:
#   APP_BASE_URL=https://clocklog.net
#   CORS_ORIGINS=https://clocklog.net
#   NEXT_PUBLIC_API_URL=https://clocklog.net/api

# --- port 80: all traffic to https -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name clocklog.net www.clocklog.net;

    location / {
        return 301 https://$host$request_uri;
    }
}

