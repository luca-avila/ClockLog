# Example reverse-proxy config for the single-domain layout (see docs/operations.md).
# One origin serves both halves: / is the frontend, /api is the backend. This makes
# CORS irrelevant — the browser never goes cross-origin.
#
# Copy to /etc/nginx/sites-available/clocklog and symlink it into sites-enabled,
# then obtain a cert covering both names (run as root on the VPS, outside Compose):
#
#   certbot --nginx -d clocklog.net -d www.clocklog.net
#
# Ports match the PROD overlay (docker-compose.prod.yml):
#   frontend binds 127.0.0.1:3001  (moved off 3000 to leave that host port free)
#   backend  binds 127.0.0.1:8000
# With these, the .env values are:
#   APP_BASE_URL=https://clocklog.net
#   CORS_ORIGINS=https://clocklog.net
#   NEXT_PUBLIC_API_URL=https://clocklog.net/api

# --- port 80: all traffic to https, www to the apex ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name clocklog.net www.clocklog.net;

    # certbot --nginx rewrites this block to serve the ACME challenge and then
    # adds a 301 to https. Keep it plain until you have run that command.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- https: www redirects to apex, then / is frontend and /api is backend ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clocklog.net www.clocklog.net;

    # Managed by certbot --nginx. Cert paths are regenerated on renewal.
    ssl_certificate     /etc/letsencrypt/live/clocklog.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clocklog.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # www -> apex so the app is always on one origin (cookies/tokens live in a
    # header, not a cookie, but a single canonical host keeps CORS out of the way).
    if ($host = www.clocklog.net) {
        return 301 https://clocklog.net$request_uri;
    }

    # Backend. The trailing slash on proxy_pass strips the /api prefix, mapping
    # /api/auth/register -> /auth/register, because the backend routers mount at
    # the app root.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend takes the LAST X-Forwarded-For entry as the client IP for
        # rate limiting — that is what nginx appends here. Do not add another hop
        # in front without reading docs/operations.md first.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js standalone server).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
