# Production compatibility shim for the legacy two-file command.
#
# The base docker-compose.yml IS the complete prod stack: prod stage, no bind
# mounts, required ${VAR:?} for every variable including RESEND_API_KEY,
# loopback-only ports, full healthchecks and the backup sidecar. The dev
# override is never loaded when `-f` is passed, so this file adds no
# structural delta — with a complete .env, `docker compose config` for the
# two-file command below is byte-identical to the base (diff is empty by
# design).
#
# Deploy (canonical):
#
#   docker compose -f docker-compose.yml up -d --build
#
# Legacy equivalent, kept so existing scripts keep working; behavior is
# unchanged because prod safety now lives entirely in the base:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
