# Production overlay. nginx and TLS (certbot) run on the VPS itself, outside
# this file — services bind to 127.0.0.1 only and the reverse proxy fronts them.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Secrets come from .env (see .env.example).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-10}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    # Unattended boot: apply migrations, then serve.
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # Nightly pg_dump with local rotation; uploads off-site when
  # BACKUP_RCLONE_REMOTE is set (mount rclone.conf read-only if needed).
  backup:
    build: ./infra/backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_RCLONE_REMOTE=${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
      # - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  backups:
