# Production-only layer. The base docker-compose.yml is already prod-safe
# (prod stage, no bind mounts, required ${VAR:?}, loopback ports, full
# healthchecks, backup sidecar), and the dev override is never loaded because
# the deploy command passes an explicit `-f`.
#
# Deploy command:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This layer's only job is to require the one variable dev/CI leave empty on
# purpose: without a RESEND_API_KEY no transactional email can complete, and a
# prod running in silent log mode is exactly the failure this handoff removes.
# Do not deploy from the base alone — it boots, but email degrades to dev log
# mode without any error.

services:
  backend:
    environment:
      # Vacía = sender en modo log (dev/CI). En prod sin key ningún registro
      # puede completarse: que falle el config, no el runtime.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY requerida en prod}
