# Compatibility shim for the legacy two-file production command:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The recommended command is now a single file — `docker compose -f
# docker-compose.yml up -d --build` — because docker-compose.yml is already
# prod-safe (prod stage, no bind mounts, required ${VAR:?}, loopback ports,
# full healthchecks, backup sidecar). Passing `-f` also skips the auto-loaded
# docker-compose.override.yml, so nothing dev leaks into prod.
#
# This file survives only to keep the legacy two-file command working and to
# require the one variable dev/CI leave empty on purpose.

services:
  backend:
    environment:
      # Vacía = sender en modo log (dev/CI). En prod sin key ningún registro
      # puede completarse: que falle el config, no el runtime.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY requerida en prod}
