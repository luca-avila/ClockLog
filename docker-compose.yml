# Base Compose file — prod-safe by construction.
#
# docker-compose.override.yml is auto-loaded only when no `-f` is passed, so
# `docker compose up -d` is the dev stack. Production deploys from this file
# alone; an explicit `-f` skips the override, so prod inherits nothing dev and
# never has to "undo" it:
#
#   docker compose -f docker-compose.yml up -d --build
#
# Every required variable — RESEND_API_KEY included — interpolates with
# ${VAR:?message}, so a missing or empty value fails at `docker compose
# config`, not at runtime, in every mode. Dev and CI satisfy the RESEND
# interpolation with a non-secret placeholder in .env (or the shell) and
# docker-compose.override.yml pins the container's runtime value back to
# empty, where the sender logs the link instead of mailing. For a legacy
# two-file command, docker-compose.prod.yml exists and merges to a
# byte-identical config; it adds no gate the base lacks.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      # Runtime-only stage (non-root appuser). Dev switches to `dev` in
      # docker-compose.override.yml — never point this at dev.
      target: prod
    image: clocklog-backend:${TAG:-latest}
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"
    ports:
      # Loopback only: nginx on the host fronts both services.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required in .env}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      AUTH_EMAIL_RATE_LIMIT: ${AUTH_EMAIL_RATE_LIMIT:-3}
      AUTH_EMAIL_RATE_WINDOW_SECONDS: ${AUTH_EMAIL_RATE_WINDOW_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required in .env}
      # Required like the rest: a missing/empty value fails `config` in any
      # mode. Dev/CI satisfy interpolation with a NON-secret placeholder in
      # .env and the override pins the runtime to empty, so the sender keeps
      # logging the link and conftest (empty key mandatory in tests) stays
      # green.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY required in .env}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required in .env}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL required in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env}
    # ports:  # uncomment for a direct client (psql from the host)
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d probes the real DB, not just "the server accepts connections": the
      # old check passed on matching user/DB names by coincidence.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:?} -d $${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time: changing NEXT_PUBLIC_API_URL requires a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required in .env}
    image: clocklog-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    logging: *default-logging

  # Nightly pg_dump with local rotation; uploads off-site when
  # BACKUP_RCLONE_REMOTE is set (see .env.example for the tradeoff).
  backup:
    build: ./infra/backup
    image: clocklog-backup:${TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB required in .env}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # Local retention: 14 daily copies ≈ two weeks.
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Empty = local-only (a conscious choice; verify by hand).
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
      # Off-site: uncomment and mount rclone.conf (see .env.example).
      # - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  backups:
