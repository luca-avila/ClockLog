services:
  backend:
    build:
      context: ./backend
      target: dev
    command: >
      sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"
    ports:
      # 127.0.0.1 only: the prod overlay inherits this binding, and old Compose
      # versions concatenate (not replace) ports across files, so defining a
      # second mapping in the overlay would double-bind host port 8000.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog
      - SECRET_KEY=dev-secret-change-in-production
      # Tests DELETE from every table — they run against clocklog_test, never
      # the dev DB. The name must end in _test (conftest enforces it).
      - TEST_DATABASE_URL=postgresql+asyncpg://clocklog:clocklog@db:5432/clocklog_test
      # Emailed links point at the frontend. RESEND_API_KEY is deliberately
      # unset in dev: the sender then logs the link instead of sending.
      - APP_BASE_URL=http://localhost:3000
      - EMAIL_FROM=ClockLog <no-reply@localhost>
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=clocklog
      - POSTGRES_PASSWORD=clocklog
      - POSTGRES_DB=clocklog
    # ports:  # uncomment to expose on host
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clocklog"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
