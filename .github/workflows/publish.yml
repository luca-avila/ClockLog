name: Publish

# Builds the prod images on fast CI runners and pushes them to GHCR.
# The VPS no longer compiles: it pulls and restarts (see docs/operations.md
# Deployment). Triggered only on pushes to main, never on PRs, so every
# published image is code that passed CI on main.
#
# Setup (once):
#   1. Repo variable: Settings -> Secrets and variables -> Actions ->
#      Variables -> NEXT_PUBLIC_API_URL = https://clocklog.net/api
#      (baked into the frontend bundle at build time; no default on purpose).
#   2. Images are private: one `docker login ghcr.io` on the VPS with a PAT
#      that has read:packages.
#   3. No other secret needed: GITHUB_TOKEN already has packages:write below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check NEXT_PUBLIC_API_URL variable
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Repo variable NEXT_PUBLIC_API_URL is not set (Settings -> Secrets and variables -> Actions -> Variables). Refusing to bake an empty API URL."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/luca-avila/clocklog-backend:latest
            ghcr.io/luca-avila/clocklog-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/luca-avila/clocklog-frontend:latest
            ghcr.io/luca-avila/clocklog-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backup
        uses: docker/build-push-action@v6
        with:
          context: ./infra/backup
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/luca-avila/clocklog-backup:latest
            ghcr.io/luca-avila/clocklog-backup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
